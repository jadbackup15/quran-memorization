<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quran Memorization Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f0e8;
      color: #2c2c2c;
      min-height: 100vh;
    }

    header {
      background: #1a3a2a;
      color: #fff;
      padding: 24px 32px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }

    header h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 4px; }

    .version-badge {
      position: absolute;
      top: 12px;
      right: 16px;
      font-size: 0.72rem;
      color: #9dbfaa;
      font-family: ui-monospace, monospace;
    }

    .back-link {
      display: inline-block;
      color: #9dbfaa;
      text-decoration: none;
      font-size: 0.85rem;
      margin-bottom: 12px;
      transition: color 0.15s;
    }
    .back-link:hover { color: #fff; }

    .stats { display: flex; gap: 32px; align-items: center; flex-wrap: wrap; }

    .stat { display: flex; flex-direction: column; gap: 2px; }

    .stat-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: #9dbfaa; }

    .stat-value { font-size: 1.5rem; font-weight: 700; color: #fff; }

    .stat-pct { font-size: 0.78rem; color: #5cb87a; font-weight: 600; }

    .progress-bar-wrap { flex: 1; min-width: 200px; }

    .progress-bar-bg { background: rgba(255,255,255,0.15); border-radius: 99px; height: 10px; overflow: hidden; }

    .progress-bar-fill {
      background: #5cb87a; height: 100%; border-radius: 99px;
      transition: width 0.3s ease; width: 0%;
    }

    .progress-label { font-size: 0.72rem; color: #9dbfaa; margin-top: 4px; text-align: right; }

    /* Tabs */
    .tabs {
      display: flex; gap: 0;
      background: #eee8d8; border-bottom: 1px solid #d8cdb0;
    }

    .tab-btn {
      padding: 10px 24px; border: none; background: none;
      font-size: 0.875rem; font-weight: 500; color: #6a5a40;
      cursor: pointer; border-bottom: 3px solid transparent;
      transition: color 0.15s, border-color 0.15s;
      border-radius: 0;
    }

    .tab-btn:hover { color: #1a3a2a; background: none; }
    .tab-btn.active { color: #1a3a2a; border-bottom-color: #3a7a55; }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* Plan tab */
    .plan-wrap { padding: 32px; max-width: 700px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

    .plan-card {
      background: #fff; border: 1.5px solid #e0d8c8; border-radius: 10px; padding: 24px;
    }

    .plan-card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 16px; color: #1a3a2a; }

    .rate-inputs { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

    .rate-inputs input[type="number"] {
      width: 80px; padding: 8px 10px; border: 1.5px solid #c8bda0;
      border-radius: 6px; font-size: 1rem; outline: none; text-align: center;
    }

    .rate-inputs input[type="number"]:focus { border-color: #3a7a55; }

    .rate-inputs select {
      padding: 8px 10px; border: 1.5px solid #c8bda0; border-radius: 6px;
      font-size: 0.9rem; outline: none; background: #fff; cursor: pointer;
    }

    .rate-inputs select:focus { border-color: #3a7a55; }

    .plan-result {
      background: #eaf5ed; border: 1.5px solid #5cb87a; border-radius: 8px;
      padding: 20px 24px; display: grid;
      grid-template-columns: 1fr 1fr; gap: 16px;
    }

    .plan-result.empty { background: #f5f0e8; border-color: #d8cdb0; }

    .result-item { display: flex; flex-direction: column; gap: 3px; }
    .result-label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.07em; color: #6a7a60; }
    .result-value { font-size: 1.25rem; font-weight: 700; color: #1a3a2a; }
    .result-sub { font-size: 0.75rem; color: #5a7a60; }

    .plan-timeline {
      display: flex; flex-direction: column; gap: 8px;
    }

    .milestone {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px; background: #faf6ee;
      border: 1px solid #e8e0cc; border-radius: 7px;
    }

    .milestone.done { background: #eaf5ed; border-color: #5cb87a; }

    .milestone-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #c8bda0; flex-shrink: 0;
    }

    .milestone.done .milestone-dot { background: #5cb87a; }

    .milestone-label { flex: 1; font-size: 0.85rem; font-weight: 500; }
    .milestone-date { font-size: 0.78rem; color: #6a7a60; }
    .milestone.done .milestone-date { color: #3a8a55; font-weight: 600; }

    .controls {
      padding: 12px 32px;
      display: flex; gap: 12px; align-items: center;
      background: #eee8d8; border-bottom: 1px solid #d8cdb0; flex-wrap: wrap;
    }

    .controls input[type="text"] {
      padding: 7px 12px; border: 1px solid #c8bda0; border-radius: 6px;
      background: #fff; font-size: 0.875rem; width: 200px; outline: none;
    }

    .controls input[type="text"]:focus { border-color: #3a7a55; }

    button {
      padding: 7px 14px; border: 1px solid #c8bda0; border-radius: 6px;
      background: #fff; font-size: 0.8rem; cursor: pointer; color: #2c2c2c;
      transition: background 0.15s;
    }

    button:hover { background: #f0e8d0; }

    button.primary { background: #1a3a2a; color: #fff; border-color: #1a3a2a; }
    button.primary:hover { background: #2a5a40; }

    .btn-load {
      padding: 7px 14px; border: 1px solid #c8bda0; border-radius: 6px;
      background: #fff; font-size: 0.8rem; cursor: pointer; color: #2c2c2c;
      transition: background 0.15s;
    }
    .btn-load:hover { background: #f0e8d0; }

    /* Juz sections */
    .content { padding: 20px 32px; display: flex; flex-direction: column; gap: 10px; }

    .juz-section { background: #fff; border: 1.5px solid #e0d8c8; border-radius: 10px; overflow: hidden; }

    .juz-header {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; cursor: pointer;
      background: #fff; transition: background 0.15s;
      user-select: none;
    }

    .juz-header:hover { background: #faf6ee; }

    .juz-section.all-memorized .juz-header { background: #eaf5ed; }

    .juz-checkbox {
      width: 18px; height: 18px; accent-color: #3a7a55;
      flex-shrink: 0; cursor: pointer;
    }

    .juz-number {
      background: #1a3a2a; color: #fff;
      font-size: 0.7rem; font-weight: 700;
      padding: 3px 8px; border-radius: 4px;
      flex-shrink: 0; min-width: 52px; text-align: center;
    }

    .juz-section.all-memorized .juz-number { background: #3a8a55; }

    .juz-title { flex: 1; }

    .juz-title-en { font-size: 0.9rem; font-weight: 600; }
    .juz-title-ar { font-size: 0.8rem; color: #6a7a60; direction: rtl; }

    .juz-meta { font-size: 0.72rem; color: #8a7a60; white-space: nowrap; }

    .juz-toggle { font-size: 0.75rem; color: #8a7a60; transition: transform 0.2s; flex-shrink: 0; }
    .juz-section.open .juz-toggle { transform: rotate(180deg); }

    .juz-body {
      display: none;
      padding: 4px 12px 12px;
      border-top: 1px solid #f0e8d8;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 6px;
    }

    .juz-section.open .juz-body { display: grid; }

    /* Surah cards */
    .surah-card {
      background: #faf6ee; border: 1.5px solid #e8e0cc;
      border-radius: 7px; padding: 9px 12px;
      display: flex; align-items: center; gap: 10px;
      cursor: pointer; transition: border-color 0.15s, background 0.15s;
      user-select: none;
    }

    .surah-card:hover { background: #f3ede0; border-color: #bfb090; }

    .surah-card.memorized { background: #eaf5ed; border-color: #5cb87a; }

    .surah-card input[type="checkbox"] {
      width: 16px; height: 16px; accent-color: #3a7a55;
      flex-shrink: 0; cursor: pointer;
    }

    .surah-num { font-size: 0.68rem; color: #8a7a60; width: 20px; text-align: right; flex-shrink: 0; }

    .surah-name { flex: 1; }
    .surah-name-en { font-size: 0.85rem; font-weight: 500; }
    .surah-name-ar { font-size: 0.72rem; color: #6a7a60; direction: rtl; }

    .surah-ayahs { font-size: 0.68rem; color: #8a7a60; white-space: nowrap; flex-shrink: 0; }

    .hidden { display: none !important; }
  </style>
  <script src="version.js"></script>
  <script src="log.js"></script>
</head>

<div class="tabs">

<!-- Tracker tab -->
<div class="tab-panel active" id="tab-tracker">

    <div class="plan-card">

      <div class="plan-timeline" id="plan-timeline"></div>
    </div>

  </div>
</div>

const TOTAL_AYAHS = 6236;

const checked = new Set();

// Group surahs by juz
const byJuz = {};
for (let j = 1; j <= 30; j++) byJuz[j] = [];
SURAHS.forEach(s => byJuz[s[4]].push(s));

function render(filter = "") {
  const content = document.getElementById("content");
  const q = filter.toLowerCase();
  content.innerHTML = "";

  for (let juz = 1; juz <= 30; juz++) {
    const surahs = byJuz[juz];
    const filtered = q
      ? surahs.filter(([num, en, ar]) =>
          en.toLowerCase().includes(q) || ar.includes(q) || String(num).includes(q))
      : surahs;

    if (q && filtered.length === 0) continue;

    const juzAyahs = surahs.reduce((s, x) => s + x[3], 0);
    const juzPages = Math.max(...surahs.map(x => x[6])) - Math.min(...surahs.map(x => x[5])) + 1;
    const memorizedCount = surahs.filter(([num]) => checked.has(num)).length;
    const allMemorized = memorizedCount === surahs.length;
    const someMemorized = memorizedCount > 0 && !allMemorized;

    const section = document.createElement("div");
    section.className = "juz-section" + (allMemorized ? " all-memorized" : "") + (q ? " open" : "");
    section.dataset.juz = juz;

    // Header
    const header = document.createElement("div");
    header.className = "juz-header";
    header.innerHTML = `
      <input type="checkbox" class="juz-checkbox" ${allMemorized ? "checked" : ""} />
      <span class="juz-number">Juz ${juz}</span>
      <span class="juz-title">
        <div class="juz-title-en">Juz ${juz}</div>
        <div class="juz-title-ar">${JUZ_NAMES[juz]}</div>
      </span>
      <span class="juz-meta">${surahs.length} surahs · ${juzPages}p · ${juzAyahs.toLocaleString()}v${memorizedCount > 0 ? ` · ${memorizedCount}/${surahs.length} memorized` : ""}</span>
      <span class="juz-toggle">▼</span>
    `;

    const cb = header.querySelector(".juz-checkbox");
    cb.indeterminate = someMemorized;

    cb.addEventListener("change", e => {
      e.stopPropagation();
      surahs.forEach(([num]) => e.target.checked ? checked.add(num) : checked.delete(num));
      render(document.getElementById("search").value);
      updateStats();
    });

    header.addEventListener("click", e => {
      if (e.target.classList.contains("juz-checkbox")) return;
      section.classList.toggle("open");
    });

    // Body
    const body = document.createElement("div");
    body.className = "juz-body";

    filtered.forEach(([num, en, ar, ayahs, , startPage, endPage]) => {
      const pages = endPage - startPage + 1;
      const card = document.createElement("label");
      card.className = "surah-card" + (checked.has(num) ? " memorized" : "");
      card.innerHTML = `
        <input type="checkbox" ${checked.has(num) ? "checked" : ""} />
        <span class="surah-num">${num}</span>
        <span class="surah-name">
          <div class="surah-name-en">${en}</div>
          <div class="surah-name-ar">${ar}</div>
        </span>
        <span class="surah-ayahs">${pages}p · ${ayahs}v</span>
      `;
      card.querySelector("input").addEventListener("change", e => {
        e.target.checked ? checked.add(num) : checked.delete(num);
        card.classList.toggle("memorized", e.target.checked);
        // Update juz header state
        const sec = document.querySelector(`.juz-section[data-juz="${num > 0 ? surahs[0][4] : 1}"]`);
        refreshJuzHeader(juz);
        updateStats();
      });
      body.appendChild(card);
    });

    section.appendChild(header);
    section.appendChild(body);
    content.appendChild(section);
  }
}

function refreshJuzHeader(juz) {
  const section = document.querySelector(`.juz-section[data-juz="${juz}"]`);
  if (!section) return;
  const surahs = byJuz[juz];
  const memorizedCount = surahs.filter(([num]) => checked.has(num)).length;
  const allMemorized = memorizedCount === surahs.length;
  const someMemorized = memorizedCount > 0 && !allMemorized;
  const juzAyahs = surahs.reduce((s, x) => s + x[3], 0);
  const juzPages = Math.max(...surahs.map(x => x[6])) - Math.min(...surahs.map(x => x[5])) + 1;

  section.classList.toggle("all-memorized", allMemorized);
  const cb = section.querySelector(".juz-checkbox");
  cb.checked = allMemorized;
  cb.indeterminate = someMemorized;
  section.querySelector(".juz-meta").textContent =
    `${surahs.length} surahs · ${juzPages}p · ${juzAyahs.toLocaleString()}v${memorizedCount > 0 ? ` · ${memorizedCount}/${surahs.length} memorized` : ""}`;
}

function updateStats() {
  let totalAyahs = 0, totalSurahs = 0;
  SURAHS.forEach(([num, , , ayahs]) => {
    if (checked.has(num)) { totalAyahs += ayahs; totalSurahs++; }
  });
  const totalPages = getMemorizedPages().size;
  const pctSurahs = (totalSurahs / 114 * 100).toFixed(1);
  const pctPages  = Math.min(totalPages / TOTAL_PAGES * 100, 100).toFixed(1);
  const pctAyahs  = (totalAyahs / TOTAL_AYAHS * 100).toFixed(1);

  document.getElementById("stat-surahs").textContent    = `${totalSurahs} / 114`;
  document.getElementById("stat-pct-surahs").textContent = `${pctSurahs}%`;
  document.getElementById("stat-pages").textContent     = `${totalPages} / 604`;
  document.getElementById("stat-pct-pages").textContent  = `${pctPages}%`;
  document.getElementById("stat-ayahs").textContent     = `${totalAyahs.toLocaleString()} / 6,236`;
  document.getElementById("stat-pct-ayahs").textContent  = `${pctAyahs}%`;
  document.getElementById("progress-fill").style.width  = `${pctPages}%`;
  document.getElementById("progress-label").textContent = `${totalPages} of 604 pages (${pctPages}%)`;
}

function selectAll() {
  SURAHS.forEach(([num]) => checked.add(num));
  render(document.getElementById("search").value);
  updateStats();
}

function clearAll() {
  checked.clear();
  render(document.getElementById("search").value);
  updateStats();
}

function expandAll() {
  document.querySelectorAll(".juz-section").forEach(s => s.classList.add("open"));
}

function collapseAll() {
  document.querySelectorAll(".juz-section").forEach(s => s.classList.remove("open"));
}

// File System Access API — handle persisted in IndexedDB so the same file
// is reused across page reloads without re-prompting.
let _fileHandle = null;

// IndexedDB helpers
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("quran-tracker", 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore("handles");
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = () => reject(req.error);
  });
}

async function storeHandle(handle) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("handles", "readwrite");
    tx.objectStore("handles").put(handle, "progress");
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

async function getStoredHandle() {
  const db = await openDB();
  return new Promise(resolve => {
    const tx = db.transaction("handles", "readonly");
    const req = tx.objectStore("handles").get("progress");
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => resolve(null);
  });
}

// Exports the full site log (this page's memorized surahs plus review.html's
// data, read straight from shared localStorage) so one file backs up everything.
function progressData() {
  return JSON.stringify(buildFullLogData(), null, 2);
}

function applyProgress(list) {
  checked.clear();
  list.forEach(n => checked.add(Number(n)));
  localStorage.setItem(LOG_KEYS.tracker.memorized, JSON.stringify([...checked]));
  render(document.getElementById("search").value);
  updateStats();
}

async function saveToFile() {
  const btn = document.querySelector("button.primary");
  try {
    if (!_fileHandle) {
      _fileHandle = await window.showSaveFilePicker({
        suggestedName: "quran-log.json",
        types: [{ description: "JSON", accept: { "application/json": [".json"] } }],
      });
      await storeHandle(_fileHandle);
    }
    const writable = await _fileHandle.createWritable();
    await writable.write(progressData());
    await writable.close();
    localStorage.setItem(LOG_KEYS.tracker.memorized, JSON.stringify([...checked]));
    btn.textContent = "Saved!";
    setTimeout(() => btn.textContent = "Save to File", 1500);
  } catch (err) {
    if (err.name !== "AbortError") alert("Save failed: " + err.message);
  }
}

async function loadFromFile() {
  try {
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: "JSON", accept: { "application/json": [".json"] } }],
    });
    _fileHandle = handle;
    await storeHandle(handle);
    const file = await handle.getFile();
    const data = normalizeLogData(JSON.parse(await file.text()));
    if (!data) throw new Error("Invalid format");
    applyFullLogData(data); // writes review.html's section too, if present
    if (data.tracker && Array.isArray(data.tracker.memorized)) applyProgress(data.tracker.memorized);
  } catch (err) {
    if (err.name !== "AbortError") alert("Could not load file — make sure it's a valid quran-log.json.");
  }
}

// On startup: restore the stored file handle and auto-load from it if permission is already granted
async function initFileHandle() {
  const handle = await getStoredHandle().catch(() => null);
  if (!handle) return;
  try {
    const perm = await handle.queryPermission({ mode: "readwrite" });
    if (perm === "granted") {
      _fileHandle = handle;
      // Auto-load file data (file is source of truth; localStorage is a fallback)
      const file = await handle.getFile();
      const data = normalizeLogData(JSON.parse(await file.text()));
      if (data) {
        applyFullLogData(data);
        if (data.tracker && Array.isArray(data.tracker.memorized)) applyProgress(data.tracker.memorized);
      }
    } else {
      // Permission not yet granted for this session — store handle so the first
      // Save/Load click will reuse the same file after granting permission.
      _fileHandle = handle;
    }
  } catch {
    // Handle stale or unavailable — ignore, user can pick a new file
  }
}

document.getElementById("search").addEventListener("input", e => render(e.target.value));

// --- Shared helpers ---

function getMemorizedPages() {
  const s = new Set();
  SURAHS.forEach(([num, , , , , start, end]) => {
    if (checked.has(num)) for (let p = start; p <= end; p++) s.add(p);
  });
  return s;
}

function formatDuration(days) {
  const y = Math.floor(days / 365);
  const m = Math.floor((days % 365) / 30);
  const d = days % 30;
  const parts = [];
  if (y) parts.push(`${y}y`);
  if (m) parts.push(`${m}mo`);
  if (d || parts.length === 0) parts.push(`${d}d`);
  return parts.join(" ");
}

// Tab switching
function switchTab(tab) {
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  document.querySelectorAll(".tab-panel").forEach(p => p.classList.toggle("active", p.id === "tab-" + tab));
  if (tab === "plan") updatePlan();
}

// Plan tab
const MILESTONES = [
  { pct: 10,  label: "10% — First 60 pages" },
  { pct: 25,  label: "25% — Juz 7–8 reached" },
  { pct: 33,  label: "1/3 — Surah Al-Kahf area" },
  { pct: 50,  label: "Half — Juz 15 complete" },
  { pct: 66,  label: "2/3 — Juz 20 complete" },
  { pct: 75,  label: "3/4 — Juz 22–23 area" },
  { pct: 90,  label: "90% — Juz 27 complete" },
  { pct: 100, label: "Complete — Full Quran" },
];

function updatePlan() {
  const memorized = getMemorizedPages().size;
  const remaining = TOTAL_PAGES - memorized;
  const pct = (memorized / TOTAL_PAGES * 100).toFixed(1);

  const amount = parseFloat(document.getElementById("rate-amount").value) || 0;
  const unit = document.getElementById("rate-unit").value;

  document.getElementById("res-done").textContent = `${memorized} / 604`;
  document.getElementById("res-done-pct").textContent = `${pct}% complete`;
  document.getElementById("res-remaining").textContent = remaining;

  const result = document.getElementById("plan-result");

  if (amount <= 0 || remaining === 0) {
    document.getElementById("res-duration").textContent = remaining === 0 ? "Done!" : "—";
    document.getElementById("res-date").textContent = remaining === 0 ? "Completed" : "—";
    document.getElementById("res-date-detail").textContent = "";
    result.classList.toggle("empty", remaining > 0);
    renderMilestones(memorized, 0, unit);
    return;
  }

  // pages per day
  const pagesPerDay = unit === "day" ? amount : unit === "week" ? amount / 7 : amount / 30.44;
  const daysNeeded = Math.ceil(remaining / pagesPerDay);

  const finish = new Date();
  finish.setDate(finish.getDate() + daysNeeded);

  const rateLabel = `at ${amount} page${amount !== 1 ? "s" : ""}/${unit}`;
  document.getElementById("res-duration").textContent = formatDuration(daysNeeded);
  document.getElementById("res-rate-display").textContent = rateLabel;
  document.getElementById("res-date").textContent = finish.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  document.getElementById("res-date-detail").textContent = `in ${daysNeeded.toLocaleString()} days`;
  result.classList.remove("empty");

  renderMilestones(memorized, pagesPerDay, unit);
}

function renderMilestones(memorized, pagesPerDay, unit) {
  const tl = document.getElementById("plan-timeline");
  tl.innerHTML = "";
  const today = new Date();

  MILESTONES.forEach(({ pct, label }) => {
    const targetPages = Math.round(TOTAL_PAGES * pct / 100);
    const done = memorized >= targetPages;

    const el = document.createElement("div");
    el.className = "milestone" + (done ? " done" : "");

    let dateStr = "", timeLeft = "";
    if (done) {
      dateStr = "Completed";
      timeLeft = "";
    } else if (pagesPerDay > 0) {
      const daysAway = Math.ceil((targetPages - memorized) / pagesPerDay);
      const d = new Date(today);
      d.setDate(d.getDate() + daysAway);
      dateStr = d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
      timeLeft = `in ${formatDuration(daysAway)}`;
    } else {
      dateStr = "—";
      timeLeft = "";
    }

    el.innerHTML = `
      <div class="milestone-dot"></div>
      <span class="milestone-label">${label} <span style="font-weight:400;color:#8a7a60">(${targetPages}p)</span></span>
      <span class="milestone-date">${dateStr}${timeLeft ? `<br><span style="font-size:0.7rem;opacity:0.8">${timeLeft}</span>` : ""}</span>
    `;
    tl.appendChild(el);
  });
}

document.getElementById("version-badge").textContent = "v" + APP_VERSION;

document.getElementById("rate-amount").addEventListener("input", updatePlan);
document.getElementById("rate-unit").addEventListener("change", updatePlan);

// Load saved progress from localStorage (instant, synchronous)
const saved = localStorage.getItem(LOG_KEYS.tracker.memorized);
if (saved) JSON.parse(saved).forEach(n => checked.add(n));
render();
updateStats();
// Then try to restore the file handle and reload from the JSON file
initFileHandle();
</script>
