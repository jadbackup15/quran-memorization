<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hizb Detail — Quran Review</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
  <script src="version.js"></script>
  <script src="log.js"></script>
  <script src="quran-data.js"></script>
  <script src="quran-cache.js"></script>
  <script src="mistake-analytics.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f0e8;
      --text: #2c2c2c;
      --card-bg: #fff;
      --card-border: #e0d8c8;
      --muted: #8a7a60;
      --muted-2: #6a5a40;
      --muted-3: #a09070;
      --input-border: #c8bda0;
      --input-bg: #fff;
      --accent: #3a7a55;
      --accent-hover: #2a5a40;
      --hover-bg: #f0e8d0;
      --surface-2: #faf6ee;
      --divider: #f0e8d8;
      --status-ok-bg: #eaf5ed;
      --status-ok-text: #2a5a40;
      --status-bad-bg: #fff0f0;
      --status-bad-text: #a03030;
      --status-bad-border: #e08080;
      --warn-bg: #fff8e6;
      --warn-border: #e8d29a;
      --warn-text: #8a6a20;
      --warn-divider: #efdfb0;
      --warn-text-2: #a08030;
      --warn-badge-bg: #ffe9c2;
      --warn-badge-text: #a05a10;
      --warn-arabic: #4a3a10;
      --arabic-text: #1a3a2a;
      --strength-weak-border: #e0a0a0;
      --spinner-track: #d0c8b0;
      --amber-accent: #c9822e;
      --amber-accent-hover: #a86a20;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1c17;
        --text: #e8e2d0;
        --card-bg: #232520;
        --card-border: #3a3a30;
        --muted: #b0a480;
        --muted-2: #c0b494;
        --muted-3: #8a8068;
        --input-border: #4a4a3a;
        --input-bg: #20221d;
        --accent: #5cb87a;
        --accent-hover: #6cc88a;
        --hover-bg: #2c2c22;
        --surface-2: #1e201a;
        --divider: #34342a;
        --status-ok-bg: #1c3324;
        --status-ok-text: #7cc898;
        --status-bad-bg: #3a1f1f;
        --status-bad-text: #e08888;
        --status-bad-border: #7a3a3a;
        --warn-bg: #2e2712;
        --warn-border: #5a4a28;
        --warn-text: #d4b878;
        --warn-divider: #4a3f24;
        --warn-text-2: #c8a860;
        --warn-badge-bg: #4a3a1a;
        --warn-badge-text: #d89050;
        --warn-arabic: #e0c890;
        --arabic-text: #a8d4b8;
        --strength-weak-border: #7a3a3a;
        --spinner-track: #4a4a3a;
        --amber-accent: #c9822e;
        --amber-accent-hover: #d89850;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: #1a3a2a;
      color: #fff;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }

    header h1 { font-size: 1.15rem; font-weight: 600; flex: 1; }

    .version-badge {
      font-size: 0.72rem;
      color: #9dbfaa;
      font-family: ui-monospace, monospace;
    }

    .app-nav {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: center;
    }
    .app-nav a {
      color: #9dbfaa;
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.15s;
    }
    .app-nav a:hover { color: #fff; }

    .page-layout {
      max-width: 780px;
      margin: 0 auto;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .back-link {
      font-size: 0.85rem;
      color: var(--muted-2);
      text-decoration: none;
    }
    .back-link:hover { color: var(--accent); }

    .card {
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 10px;
      padding: 20px 24px;
    }

    .status-msg {
      text-align: center;
      padding: 20px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .btn-copy {
      padding: 9px 16px;
      background: var(--card-bg);
      color: var(--muted-2);
      border: 1.5px solid var(--input-border);
      border-radius: 7px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-copy:hover { background: var(--hover-bg); }
    .btn-copy.active {
      background: #1a3a2a;
      border-color: #1a3a2a;
      color: #fff;
    }

    .suggestion-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
    }
    .suggestion-item + .suggestion-item { border-top: 1px solid var(--divider); }
    .suggestion-item-clickable {
      cursor: pointer;
      margin: 0 -8px;
      padding: 10px 8px;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .suggestion-item-clickable:hover { background: var(--bg); }

    .suggestion-rank {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.6rem;
      height: 1.6rem;
      border-radius: 50%;
      background: #1a3a2a;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .suggestion-hizb {
      font-weight: 600;
      color: var(--text);
      min-width: 80px;
    }

    .suggestion-reason {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .log-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 0;
    }
    .log-row + .log-row { border-top: 1px solid var(--divider); }

    .log-row-clickable {
      cursor: pointer;
      margin: 0 -8px;
      padding: 9px 8px;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .log-row-clickable:hover { background: var(--bg); }

    .log-expand-hint {
      color: var(--muted-3);
      font-size: 0.75rem;
    }

    .session-mistakes {
      margin: 4px 0 10px 16px;
      padding-left: 12px;
      border-left: 2px solid var(--card-border);
    }

    .session-clusters-note {
      margin: 4px 0 10px 16px;
      padding: 6px 12px;
      font-size: 0.78rem;
      color: var(--muted-2);
      background: var(--surface-2);
      border-radius: 6px;
    }

    .session-cluster-group + .session-cluster-group {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--card-border);
    }
    .session-cluster-date {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted-2);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .log-mistakes {
      font-size: 0.85rem;
      color: var(--status-bad-text);
      min-width: 90px;
    }

    .log-date {
      font-size: 0.8rem;
      color: var(--muted);
      flex: 1;
    }

    .mistake-ayah-preview {
      margin: 0 -8px 4px;
      padding: 12px 16px;
      background: var(--surface-2);
      border-radius: 6px;
    }
    .mistake-ayah-arabic {
      font-family: "Amiri", "Scheherazade New", "Traditional Arabic", "Arial Unicode MS", serif;
      font-size: 1.3rem;
      line-height: 1.9;
      direction: rtl;
      text-align: right;
      color: var(--arabic-text);
    }
    .mistake-ayah-translation {
      margin-top: 8px;
      font-size: 0.85rem;
      color: var(--muted-2);
    }

    .mistake-ayah-beginning {
      font-family: "Amiri", "Scheherazade New", "Traditional Arabic", "Arial Unicode MS", serif;
      font-size: 1rem;
      line-height: 1.6;
      direction: rtl;
      text-align: right;
      color: var(--muted-2);
      margin: 2px 0 10px;
    }

    .hizb-detail-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }
    .hizb-detail-header h2 { font-size: 1.3rem; }

    .strength-badge {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 3px 10px;
      border-radius: 20px;
    }
    .strength-badge.strength-strong { background: var(--status-ok-bg); color: var(--status-ok-text); }
    .strength-badge.strength-moderate { background: var(--warn-bg); color: var(--warn-text); }
    .strength-badge.strength-weak { background: var(--status-bad-bg); color: var(--status-bad-text); }
    .strength-badge.strength-none { background: var(--divider); color: var(--muted); }

    .last-recited { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }

    .section-header-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .section-header-row h2 {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
    }

    .timeframe-toggle { display: flex; gap: 6px; }
    .timeframe-toggle .btn-copy { padding: 5px 12px; font-size: 0.78rem; }

    .trend-chart-scroll {
      overflow-x: auto;
      overflow-y: hidden;
    }
    .trend-chart-inner {
      position: relative;
      min-width: 100%;
    }

    .trend-bars-area {
      position: relative;
      height: 70px;
      border-bottom: 1px solid var(--card-border);
    }

    .trend-gridline {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--card-border);
      opacity: 0.6;
    }

    .trend-bar {
      position: absolute;
      bottom: 0;
      width: 10px;
      margin-left: -5px;
      background: var(--accent);
      border-radius: 3px 3px 0 0;
      transition: background 0.15s;
    }
    .trend-bar.trend-bar-high { background: var(--status-bad-text); }
    .trend-bar.trend-bar-mid { background: var(--amber-accent); }

    .trend-axis {
      position: relative;
      height: 16px;
      margin-top: 4px;
    }
    .trend-axis-label {
      position: absolute;
      top: 0;
      transform: translateX(-50%);
      font-size: 0.68rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .trend-axis-label.trend-axis-label-first { transform: translateX(0); }
    .trend-axis-label.trend-axis-label-last { transform: translateX(-100%); }

    @media (max-width: 500px) {
      .page-layout { padding: 20px 14px; }
      header { padding: 14px 16px; }
    }
  </style>
</head>
<body>

<header>
  <h1>Hizb Detail</h1>
  <span class="version-badge" id="version-badge"></span>
  <nav class="app-nav">
    <a href="index.html">🏠 Home</a>
    <a href="quran-tracker.html">📖 Tracker</a>
    <a href="review.html">📝 Review</a>
    <a href="habits.html">✅ Habits</a>
  </nav>
</header>

<div class="page-layout">

  <a class="back-link" href="review.html">← Back to Review</a>

  <div id="hizb-not-found" class="status-msg" style="display: none;">
    No Hizb specified. Go back to <a href="review.html">Review</a> and click a Hizb to see its details.
  </div>

  <div id="hizb-detail-content" style="display: flex; flex-direction: column; gap: 24px;">

    <div class="card">
      <div class="hizb-detail-header">
        <h2 id="hizb-detail-title">Hizb</h2>
        <span class="strength-badge" id="hizb-detail-strength"></span>
      </div>
      <p class="last-recited" id="hizb-detail-last-recited"></p>
    </div>

    <div class="card">
      <div class="section-header-row"><h2>Mistakes Over Time</h2></div>
      <div id="hizb-detail-trend"></div>
    </div>

    <div class="card">
      <div class="section-header-row"><h2>Recitation History</h2></div>
      <div id="hizb-detail-history"></div>
    </div>

    <div class="card">
      <div class="section-header-row"><h2>Mistakes by Session</h2></div>
      <div id="hizb-detail-by-session"></div>
    </div>

    <div class="card">
      <div class="section-header-row">
        <h2>Ayat You Mistake Most</h2>
        <button type="button" class="btn-copy" onclick="printMistakeRanking()">🖨️ Print</button>
      </div>
      <div id="hizb-detail-mistakes"></div>
    </div>

    <div class="card">
      <div class="section-header-row">
        <h2>Revision Clusters (By Session)</h2>
        <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center;">
          <div class="timeframe-toggle">
            <button type="button" class="btn-copy clusters-timeframe-btn active" data-tf="all" onclick="setClustersTimeframe('all')">All-time</button>
            <button type="button" class="btn-copy clusters-timeframe-btn" data-tf="7d" onclick="setClustersTimeframe('7d')">Last 7 days</button>
            <button type="button" class="btn-copy clusters-timeframe-btn" data-tf="3d" onclick="setClustersTimeframe('3d')">Last 3 days</button>
            <button type="button" class="btn-copy clusters-timeframe-btn" data-tf="1d" onclick="setClustersTimeframe('1d')">Last 1 day</button>
          </div>
          <select class="btn-copy" id="session-clusters-print-count" title="How many to print">
            <option value="5">Top 5</option>
            <option value="10">Top 10</option>
            <option value="all" selected>All</option>
          </select>
          <button type="button" class="btn-copy" onclick="printSessionClusters()">🖨️ Print</button>
        </div>
      </div>
      <div id="hizb-detail-session-clusters"></div>
    </div>

    <div class="card">
      <div class="section-header-row">
        <h2>Revision Clusters (All Sessions)</h2>
        <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center;">
          <div class="timeframe-toggle">
            <button type="button" class="btn-copy clusters-timeframe-btn active" data-tf="all" onclick="setClustersTimeframe('all')">All-time</button>
            <button type="button" class="btn-copy clusters-timeframe-btn" data-tf="7d" onclick="setClustersTimeframe('7d')">Last 7 days</button>
            <button type="button" class="btn-copy clusters-timeframe-btn" data-tf="3d" onclick="setClustersTimeframe('3d')">Last 3 days</button>
            <button type="button" class="btn-copy clusters-timeframe-btn" data-tf="1d" onclick="setClustersTimeframe('1d')">Last 1 day</button>
          </div>
          <select class="btn-copy" id="all-sessions-clusters-print-count" title="How many to print">
            <option value="5">Top 5</option>
            <option value="10">Top 10</option>
            <option value="all" selected>All</option>
          </select>
          <button type="button" class="btn-copy" onclick="printAllSessionsClusters()">🖨️ Print</button>
        </div>
      </div>
      <div id="hizb-detail-clusters"></div>
    </div>

  </div>

</div>

<script>
// ─── Hizb detail page: standalone view of one Hizb's history, trend, mistake
// ranking, and revision clusters (formerly a modal in review.html — split out
// since this is an important, still-growing feature area). Reads ?hizb=N
// (and optional &cluster=KEY, to deep-link into "Revision Clusters" from
// review.html's "All Revision Clusters" list) from the URL.
//
// SURAHS/SURAH_OFFSETS/JUZ_RANGES/geometry helpers come from quran-data.js;
// fetchSurahData/the offline cache come from quran-cache.js; loadHizbLog,
// loadAyahMistakes, computeHizbStrength, groupAyahMistakesByCount,
// ayahMistakesForSession, computeAyahMistakeRankingForHizb,
// computeRevisionClustersForHizb, computeSessionRevisionClusters,
// clusterRangeKey/Label, ayahBeginning all come from mistake-analytics.js.

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

let currentHizb = null;
let currentEntries = [];
let showAllMistakes = false;
let expandedMistakeKey = null;   // "surah:ayah", shared across every mistake list on this page
let expandedSessionId = null;    // Recitation Log entry id, for "Mistakes by Session"
let expandedClusterKey = null;   // clusterRangeKey(), for "Revision Clusters (All Sessions)"
let expandedSessionClusterKey = null; // "sessionId:clusterRangeKey()", for "Revision Clusters (By Session)"
let clustersTimeframe = 'all';   // 'all' | '7d' — shared by both cluster lists
const surahCache = new Map();    // surah number -> { arabicAyahs, transAyahs } | null (failed)

function getUrlParams() {
  const params = new URLSearchParams(location.search);
  const hizb = parseInt(params.get('hizb'));
  const cluster = params.get('cluster');
  return { hizb: Number.isInteger(hizb) && hizb >= 1 && hizb <= 60 ? hizb : null, cluster };
}

async function initHizbDetailPage() {
  const { hizb, cluster } = getUrlParams();
  if (!hizb) {
    document.getElementById('hizb-not-found').style.display = 'block';
    document.getElementById('hizb-detail-content').style.display = 'none';
    return;
  }

  currentHizb = hizb;
  expandedClusterKey = cluster || null;

  const { score, label, entries, lastRecitedDate, daysSinceLast } = computeHizbStrength(hizb);
  currentEntries = entries;

  document.title = `Hizb ${hizb} — Quran Review`;
  document.getElementById('hizb-detail-title').textContent = `Hizb ${hizb}`;
  const badge = document.getElementById('hizb-detail-strength');
  badge.textContent = `${STRENGTH_LABELS[label]} · ${score}`;
  badge.className = `strength-badge strength-${label}`;

  document.getElementById('hizb-detail-last-recited').textContent = lastRecitedDate
    ? `Last recited ${daysSinceLast === 0 ? 'today' : daysSinceLast === 1 ? '1 day ago' : `${daysSinceLast} days ago`} (${new Date(lastRecitedDate).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })})`
    : 'Never recited yet.';

  renderTrend(entries);
  renderHistory(entries);
  await renderMistakesBySession();
  await renderMistakeRanking();
  await renderSessionClusters();
  await renderClusters();
}

// timeToPositionPct() and trendTickFractions() live in the shared
// mistake-analytics.js.

function renderTrend(entries) {
  const trendEl = document.getElementById('hizb-detail-trend');
  if (entries.length === 0) {
    trendEl.innerHTML = '<div class="status-msg">No recitations logged for this Hizb yet.</div>';
    return;
  }

  const times = entries.map(e => new Date(e.date).getTime());
  const minTime = Math.min(...times);
  const maxTime = Math.max(...times);
  const maxMistakes = Math.max(1, ...entries.map(e => e.mistakes));
  const innerWidth = Math.max(260, entries.length * 26);

  const bars = entries.map(e => {
    const t = new Date(e.date).getTime();
    const leftPct = timeToPositionPct(t, minTime, maxTime);
    const heightPct = e.mistakes === 0 ? 4 : Math.max(6, Math.round((e.mistakes / maxMistakes) * 100));
    const barClass = e.mistakes === 0 ? '' : e.mistakes >= maxMistakes * 0.66 ? 'trend-bar-high' : e.mistakes >= maxMistakes * 0.33 ? 'trend-bar-mid' : '';
    const dateLabel = new Date(e.date).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    return `<div class="trend-bar ${barClass}" style="left: ${leftPct}%; height: ${heightPct}%;" title="${e.mistakes} mistake${e.mistakes === 1 ? '' : 's'} — ${dateLabel}"></div>`;
  }).join('');

  const fractions = trendTickFractions(Math.min(5, entries.length));
  const gridlines = fractions.map(f => `<div class="trend-gridline" style="left: ${f * 100}%;"></div>`).join('');
  const axisLabels = fractions.map((f, i) => {
    const t = minTime + (maxTime - minTime) * f;
    const anchor = i === 0 ? 'trend-axis-label-first' : i === fractions.length - 1 ? 'trend-axis-label-last' : '';
    return `<div class="trend-axis-label ${anchor}" style="left: ${f * 100}%;">${new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</div>`;
  }).join('');

  trendEl.innerHTML = `
    <div class="trend-chart-scroll">
      <div class="trend-chart-inner" style="width: ${innerWidth}px;">
        <div class="trend-bars-area">${gridlines}${bars}</div>
        <div class="trend-axis">${axisLabels}</div>
      </div>
    </div>
  `;
}

// Plain (non-interactive) log of every recitation — see "Mistakes by
// Session" below for browsing what was actually mistaken in each one.
function renderHistory(entries) {
  const historyEl = document.getElementById('hizb-detail-history');
  if (entries.length === 0) {
    historyEl.innerHTML = '<div class="status-msg">Nothing logged yet.</div>';
    return;
  }
  const sorted = entries.slice().reverse();
  historyEl.innerHTML = sorted.map(e => {
    const dateLabel = new Date(e.date).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    return `
      <div class="log-row">
        <span class="log-mistakes">${e.mistakes} mistake${e.mistakes === 1 ? '' : 's'}</span>
        <span class="log-date">${dateLabel}</span>
      </div>
    `;
  }).join('');
}

// Populates surahCache for whichever of these surahs aren't already in it,
// so renderMistakeRowHtml can read ayah text synchronously.
async function ensureSurahsCached(surahNumbers) {
  const missing = [...new Set(surahNumbers)].filter(s => !surahCache.has(s));
  await Promise.all(missing.map(async s => {
    try {
      surahCache.set(s, await fetchSurahData(s));
    } catch (e) {
      surahCache.set(s, null); // render falls back to "couldn't load"
    }
  }));
}

// One mistake row shared by every list on this page: always shows the
// ayah's opening words, and — if this surah:ayah is the one currently
// expanded — its full text + translation. Requires ensureSurahsCached() to
// have already resolved for `m.surah`.
function renderMistakeRowHtml(m, rank) {
  const surahEntry = SURAHS[m.surah - 1];
  const surahName = surahEntry ? surahEntry[1] : `Surah ${m.surah}`;
  const key = `${m.surah}:${m.ayah}`;
  const expanded = expandedMistakeKey === key;
  const cached = surahCache.get(m.surah);
  const ayahData = cached && cached.arabicAyahs[m.ayah - 1];
  const transData = cached && cached.transAyahs[m.ayah - 1];

  const beginningLine = !ayahData ? '' : `<div class="mistake-ayah-beginning">${escapeHtml(ayahBeginning(ayahData.text, MISTAKE_PREVIEW_WORD_LIMIT))}</div>`;

  const expandedBlock = !expanded ? '' : `
    <div class="mistake-ayah-preview">
      ${ayahData
        ? `<div class="mistake-ayah-arabic">${escapeHtml(ayahData.text)}</div>
           <div class="mistake-ayah-translation">${escapeHtml(transData ? transData.text : '')}</div>`
        : '<div class="status-msg">Could not load this ayah.</div>'}
    </div>
  `;

  return `
    <div class="suggestion-item suggestion-item-clickable" onclick="toggleMistakeAyah(${m.surah}, ${m.ayah})">
      <span class="suggestion-rank">${rank}</span>
      <span class="suggestion-hizb">${m.surah}:${m.ayah}</span>
      <span class="suggestion-reason">${escapeHtml(surahName)} · ${m.count} mistake${m.count === 1 ? '' : 's'}</span>
    </div>
    ${beginningLine}
    ${expandedBlock}
  `;
}

// "Mistakes by Session" — the dedicated home for browsing exactly what went
// wrong in each individual sitting (pulled out of the old Recitation History
// accordion into its own section, since it's grown into a feature people
// reach for directly). Each session also surfaces its own revision clusters
// (nearby mistakes within just that one sitting), separate from the
// all-time, all-sessions clusters further down the page.
async function renderMistakesBySession() {
  const el = document.getElementById('hizb-detail-by-session');
  const sorted = currentEntries.slice().reverse();
  if (sorted.length === 0) {
    el.innerHTML = '<div class="status-msg">Nothing logged yet.</div>';
    return;
  }

  let sessionMistakes = null;
  let sessionClusters = null;
  if (expandedSessionId) {
    const activeEntry = sorted.find(e => e.id === expandedSessionId);
    if (activeEntry) {
      sessionMistakes = groupAyahMistakesByCount(ayahMistakesForSession(activeEntry));
      sessionClusters = computeSessionRevisionClusters(activeEntry).filter(c => c.distinctCount >= 2);
      await ensureSurahsCached(sessionMistakes.map(m => m.surah));
    }
  }

  el.innerHTML = sorted.map(e => {
    const dateLabel = new Date(e.date).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    const expanded = expandedSessionId === e.id;
    let body = '';
    if (expanded) {
      if (!sessionMistakes || sessionMistakes.length === 0) {
        body = '<div class="status-msg">No ayah-level mistakes logged for this session.</div>';
      } else {
        const clustersNote = !sessionClusters || sessionClusters.length === 0 ? '' : `
          <div class="session-clusters-note">
            Clusters in this session: ${sessionClusters.map(c => `${clusterRangeLabel(c)} (${c.totalMistakes} mistake${c.totalMistakes === 1 ? '' : 's'})`).join(', ')}
          </div>
        `;
        body = `${clustersNote}<div class="session-mistakes">${sessionMistakes.map((m, i) => renderMistakeRowHtml(m, i + 1)).join('')}</div>`;
      }
    }
    return `
      <div class="log-row log-row-clickable" onclick="toggleSessionMistakes('${e.id}')" title="See this session's ayah mistakes">
        <span class="log-mistakes">${e.mistakes} mistake${e.mistakes === 1 ? '' : 's'}</span>
        <span class="log-date">${dateLabel}</span>
        <span class="log-expand-hint">${expanded ? '▾' : '▸'}</span>
      </div>
      ${body}
    `;
  }).join('');
}

async function toggleSessionMistakes(sessionId) {
  expandedSessionId = expandedSessionId === sessionId ? null : sessionId;
  await renderMistakesBySession();
}

// "Ayat You Mistake Most" — the flat, Hizb-wide ranking (across every
// session ever logged for this Hizb), top 5 by default.
async function renderMistakeRanking() {
  const mistakesEl = document.getElementById('hizb-detail-mistakes');
  const fullRanking = computeAyahMistakeRankingForHizb(currentHizb);

  if (fullRanking.length === 0) {
    mistakesEl.innerHTML = '<div class="status-msg">No ayah-level mistakes logged for this Hizb.</div>';
    return;
  }

  const ranking = showAllMistakes ? fullRanking : fullRanking.slice(0, 5);
  await ensureSurahsCached(ranking.map(r => r.surah));

  const rows = ranking.map((r, idx) => renderMistakeRowHtml(r, idx + 1)).join('');
  const toggle = fullRanking.length <= 5 ? '' : `
    <button class="btn-copy" style="width: 100%; margin-top: 8px;" onclick="toggleShowAllMistakes()">
      ${showAllMistakes ? 'Show top 5 only' : `Show all ${fullRanking.length} mistakes`}
    </button>
  `;

  mistakesEl.innerHTML = rows + toggle;
}

async function toggleShowAllMistakes() {
  showAllMistakes = !showAllMistakes;
  await renderMistakeRanking();
}

// Opens a new tab with a plain, printer-friendly document and triggers the
// browser's print dialog — shared by every "🖨️ Print" button on this page's
// revision-cluster/mistake-ranking lists, which always print the FULL
// underlying list (not just whatever's currently visible or capped to a
// "top 5"/"show all" toggle on screen).
function printHtmlDocument(title, bodyHtml) {
  const win = window.open('', '_blank');
  if (!win) { alert('Please allow pop-ups for this site to print.'); return; }
  win.document.write(`
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="UTF-8">
      <title>${escapeHtml(title)}</title>
      <style>
        @page { margin: 12mm; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1a1a1a; padding: 0; font-size: 11px; }
        h1 { font-size: 1.1rem; margin: 0 0 2px; }
        h2 { font-size: 0.95rem; margin: 12px 0 4px; }
        .print-meta { font-size: 0.75rem; color: #555; margin-bottom: 10px; }
        table { border-collapse: collapse; width: 100%; margin-bottom: 8px; }
        th, td { text-align: left; padding: 3px 5px; border-bottom: 1px solid #ccc; font-size: 0.78rem; vertical-align: top; line-height: 1.25; }
        th { background: #eee; font-size: 0.72rem; }
        tr { page-break-inside: avoid; }
        .ayah-ar { font-family: "Amiri", "Scheherazade New", "Traditional Arabic", "Arial Unicode MS", serif; direction: rtl; text-align: right; font-size: 0.85rem; line-height: 1.3; }
        /* The first 6 columns (#, Range, Surah, Ayat, Ayat Mistaken,
           Mistakes) are all short/numeric — pin them to their content width
           instead of letting auto table layout hand them a share of the
           page equal to the two (much longer) Arabic columns, so Starting
           Ayah/Ending Ayah get the leftover space and wrap less. */
        .clusters-table td:nth-child(-n+6) { white-space: nowrap; }
        .clusters-table th:nth-child(1), .clusters-table td:nth-child(1) { width: 2ch; }
        .clusters-table th:nth-child(2), .clusters-table td:nth-child(2) { width: 10ch; }
        .clusters-table th:nth-child(3), .clusters-table td:nth-child(3) { width: 12ch; }
        .clusters-table th:nth-child(4), .clusters-table td:nth-child(4) { width: 4ch; }
        .clusters-table th:nth-child(5), .clusters-table td:nth-child(5) { width: 4ch; }
        .clusters-table th:nth-child(6), .clusters-table td:nth-child(6) { width: 5ch; }
      </style>
    </head>
    <body>
      <h1>${escapeHtml(title)}</h1>
      <div class="print-meta">Generated ${new Date().toLocaleString()}</div>
      ${bodyHtml}
    </body>
    </html>
  `);
  win.document.close();
  win.focus();
  win.print();
}

const CLUSTER_TIMEFRAME_LABELS = { all: 'All-time', '7d': 'Last 7 Days', '3d': 'Last 3 Days', '1d': 'Last 1 Day' };

// A printed page has far more horizontal room than the on-screen inline-expand
// summary, so cluster print tables show more of each ayah's opening words
// than MISTAKE_PREVIEW_WORD_LIMIT (used on-screen) does.
const PRINT_AYAH_PREVIEW_WORD_LIMIT = 12;

// Reads a "how many to print" <select> (values "5"/"10"/"all") and returns
// the corresponding prefix of a full, already-ranked list.
function applyPrintCount(fullList, selectId) {
  const val = document.getElementById(selectId).value;
  return val === 'all' ? fullList : fullList.slice(0, parseInt(val));
}

function clusterAyahBeginning(surah, ayah, wordLimit = MISTAKE_PREVIEW_WORD_LIMIT) {
  const cached = surahCache.get(surah);
  const ayahData = cached && cached.arabicAyahs[ayah - 1];
  return ayahData ? ayahBeginning(ayahData.text, wordLimit) : null;
}

function printMistakeRanking() {
  const fullRanking = computeAyahMistakeRankingForHizb(currentHizb);
  if (fullRanking.length === 0) {
    printHtmlDocument(`Hizb ${currentHizb} — Ayat You Mistake Most`, '<p>No ayah-level mistakes logged for this Hizb.</p>');
    return;
  }
  const rows = fullRanking.map((r, idx) => {
    const surahEntry = SURAHS[r.surah - 1];
    const surahName = surahEntry ? surahEntry[1] : `Surah ${r.surah}`;
    return `<tr><td>${idx + 1}</td><td>${r.surah}:${r.ayah}</td><td>${escapeHtml(surahName)}</td><td>${r.count}</td></tr>`;
  }).join('');
  const body = `
    <table>
      <thead><tr><th>#</th><th>Ayah</th><th>Surah</th><th>Mistakes</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
  printHtmlDocument(`Hizb ${currentHizb} — Ayat You Mistake Most`, body);
}

// Expanding/collapsing a mistake's full text is shared state across every
// mistake list on the page — all four re-render so whichever one(s)
// currently show this surah:ayah stay in sync.
async function toggleMistakeAyah(surah, ayah) {
  const key = `${surah}:${ayah}`;
  expandedMistakeKey = expandedMistakeKey === key ? null : key;
  await ensureSurahsCached([surah]);
  await renderMistakesBySession();
  await renderMistakeRanking();
  await renderSessionClusters();
  await renderClusters();
}

// "Revision Clusters (All Sessions)": nearby mistaken ayat (including
// isolated ones, as their own size-1 group) pooled across every session ever
// logged for this Hizb, ranked by total mistakes — with an All-time /
// Last-7-days toggle so progress on a specific weak passage is visible, not
// just buried in the all-time total. A cluster stops growing past
// REVISION_CLUSTER_MAX_SPAN ayat, so a handful of small, unrelated mistakes
// spread across many separate sessions can't chain into one sprawling
// "cluster" that's mostly clean ayat.
async function renderClusters() {
  const el = document.getElementById('hizb-detail-clusters');
  const clusters = computeRevisionClustersForHizb(currentHizb, clustersTimeframe);

  if (clusters.length === 0) {
    el.innerHTML = '<div class="status-msg">No mistakes logged in this timeframe yet.</div>';
    return;
  }

  const active = clusters.find(c => clusterRangeKey(c) === expandedClusterKey);
  if (active) await ensureSurahsCached(active.ayat.map(a => a.surah));

  el.innerHTML = clusters.map((c, idx) => {
    const key = clusterRangeKey(c);
    const expanded = expandedClusterKey === key;
    const surahEntry = SURAHS[c.startSurah - 1];
    const surahName = surahEntry ? surahEntry[1] : `Surah ${c.startSurah}`;
    const body = !expanded ? '' : `
      <div class="session-mistakes">
        ${c.ayat.map((m, i) => renderMistakeRowHtml(m, i + 1)).join('')}
      </div>
    `;
    return `
      <div class="suggestion-item suggestion-item-clickable" onclick="toggleClusterExpand('${key}')">
        <span class="suggestion-rank">${idx + 1}</span>
        <span class="suggestion-hizb">${clusterRangeLabel(c)}</span>
        <span class="suggestion-reason">${escapeHtml(surahName)} · ${c.totalAyatInRange} ayat · ${c.totalMistakes} mistake${c.totalMistakes === 1 ? '' : 's'}</span>
      </div>
      ${body}
    `;
  }).join('');
}

async function toggleClusterExpand(key) {
  expandedClusterKey = expandedClusterKey === key ? null : key;
  await renderClusters();
}

// Groups a flat, tagged cluster list (from computeSessionClustersForHizb)
// back into per-session groups, most recent session first — so "today's
// session" is always the first thing shown, instead of being scattered
// wherever its clusters happen to rank by mistake count in a flat list.
function groupClustersBySession(clusters) {
  const bySession = new Map(); // sessionId -> { sessionId, sessionDate, clusters: [] }
  clusters.forEach(c => {
    if (!bySession.has(c.sessionId)) bySession.set(c.sessionId, { sessionId: c.sessionId, sessionDate: c.sessionDate, clusters: [] });
    bySession.get(c.sessionId).clusters.push(c);
  });
  return Array.from(bySession.values()).sort((a, b) => new Date(b.sessionDate) - new Date(a.sessionDate));
}

// "Revision Clusters (By Session)": the same nearby-mistake clustering, but
// computed within each session individually and never merged across
// sessions — "which specific sitting had this weak passage," as opposed to
// the All Sessions list's pooled, all-time-or-7d view. Grouped under a
// date sub-header per session (most recent first) rather than one flat list,
// so a specific day's clusters — e.g. today's — are easy to find as a group
// instead of interleaved with every other session by mistake count.
async function renderSessionClusters() {
  const el = document.getElementById('hizb-detail-session-clusters');
  const clusters = computeSessionClustersForHizb(currentHizb, clustersTimeframe);

  if (clusters.length === 0) {
    el.innerHTML = '<div class="status-msg">No mistakes logged in this timeframe yet.</div>';
    return;
  }

  const groups = groupClustersBySession(clusters);

  const active = clusters.find(c => `${c.sessionId}:${clusterRangeKey(c)}` === expandedSessionClusterKey);
  if (active) await ensureSurahsCached(active.ayat.map(a => a.surah));

  el.innerHTML = groups.map(group => {
    const dateLabel = new Date(group.sessionDate).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    const rows = group.clusters.map((c, idx) => {
      const key = `${c.sessionId}:${clusterRangeKey(c)}`;
      const expanded = expandedSessionClusterKey === key;
      const surahEntry = SURAHS[c.startSurah - 1];
      const surahName = surahEntry ? surahEntry[1] : `Surah ${c.startSurah}`;
      const body = !expanded ? '' : `
        <div class="session-mistakes">
          ${c.ayat.map((m, i) => renderMistakeRowHtml(m, i + 1)).join('')}
        </div>
      `;
      return `
        <div class="suggestion-item suggestion-item-clickable" onclick="toggleSessionClusterExpand('${key}')">
          <span class="suggestion-rank">${idx + 1}</span>
          <span class="suggestion-hizb">${clusterRangeLabel(c)}</span>
          <span class="suggestion-reason">${escapeHtml(surahName)} · ${c.totalAyatInRange} ayat · ${c.totalMistakes} mistake${c.totalMistakes === 1 ? '' : 's'}</span>
        </div>
        ${body}
      `;
    }).join('');
    return `
      <div class="session-cluster-group">
        <div class="session-cluster-date">${dateLabel}</div>
        ${rows}
      </div>
    `;
  }).join('');
}

async function toggleSessionClusterExpand(key) {
  expandedSessionClusterKey = expandedSessionClusterKey === key ? null : key;
  await renderSessionClusters();
}

async function setClustersTimeframe(tf) {
  clustersTimeframe = tf;
  document.querySelectorAll('.clusters-timeframe-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.tf === tf));
  await renderClusters();
  await renderSessionClusters();
}

async function printAllSessionsClusters() {
  const fullList = computeRevisionClustersForHizb(currentHizb, clustersTimeframe);
  const timeframeLabel = CLUSTER_TIMEFRAME_LABELS[clustersTimeframe] || 'All-time';
  const title = `Hizb ${currentHizb} — Revision Clusters (All Sessions) — ${timeframeLabel}`;

  if (fullList.length === 0) {
    printHtmlDocument(title, '<p>No mistakes logged in this timeframe yet.</p>');
    return;
  }

  const clusters = applyPrintCount(fullList, 'all-sessions-clusters-print-count');
  await ensureSurahsCached(clusters.flatMap(c => [c.startSurah, c.endSurah]));

  const rows = clusters.map((c, idx) => {
    const surahEntry = SURAHS[c.startSurah - 1];
    const surahName = surahEntry ? surahEntry[1] : `Surah ${c.startSurah}`;
    const sameAyah = c.startSurah === c.endSurah && c.startAyah === c.endAyah;
    const startBeginning = clusterAyahBeginning(c.startSurah, c.startAyah, PRINT_AYAH_PREVIEW_WORD_LIMIT) || '';
    const endBeginning = sameAyah ? '' : (clusterAyahBeginning(c.endSurah, c.endAyah, PRINT_AYAH_PREVIEW_WORD_LIMIT) || '');
    return `<tr><td>${idx + 1}</td><td>${clusterRangeLabel(c)}</td><td>${escapeHtml(surahName)}</td><td>${c.totalAyatInRange}</td><td>${c.distinctCount}</td><td>${c.totalMistakes}</td><td class="ayah-ar">${escapeHtml(startBeginning)}</td><td class="ayah-ar">${escapeHtml(endBeginning)}</td></tr>`;
  }).join('');
  const body = `
    <table class="clusters-table">
      <thead><tr><th>#</th><th>Range (Start–End)</th><th>Surah</th><th>Ayat</th><th>Ayat Mistaken</th><th>Mistakes</th><th>Starting Ayah</th><th>Ending Ayah</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
  printHtmlDocument(title, body);
}

async function printSessionClusters() {
  const fullList = computeSessionClustersForHizb(currentHizb, clustersTimeframe);
  const timeframeLabel = CLUSTER_TIMEFRAME_LABELS[clustersTimeframe] || 'All-time';
  const title = `Hizb ${currentHizb} — Revision Clusters (By Session) — ${timeframeLabel}`;

  if (fullList.length === 0) {
    printHtmlDocument(title, '<p>No mistakes logged in this timeframe yet.</p>');
    return;
  }

  const clusters = applyPrintCount(fullList, 'session-clusters-print-count');
  await ensureSurahsCached(clusters.flatMap(c => [c.startSurah, c.endSurah]));

  const groups = groupClustersBySession(clusters);
  const body = groups.map(group => {
    const dateLabel = new Date(group.sessionDate).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    const rows = group.clusters.map((c, idx) => {
      const surahEntry = SURAHS[c.startSurah - 1];
      const surahName = surahEntry ? surahEntry[1] : `Surah ${c.startSurah}`;
      const sameAyah = c.startSurah === c.endSurah && c.startAyah === c.endAyah;
      const startBeginning = clusterAyahBeginning(c.startSurah, c.startAyah, PRINT_AYAH_PREVIEW_WORD_LIMIT) || '';
      const endBeginning = sameAyah ? '' : (clusterAyahBeginning(c.endSurah, c.endAyah, PRINT_AYAH_PREVIEW_WORD_LIMIT) || '');
      return `<tr><td>${idx + 1}</td><td>${clusterRangeLabel(c)}</td><td>${escapeHtml(surahName)}</td><td>${c.totalAyatInRange}</td><td>${c.distinctCount}</td><td>${c.totalMistakes}</td><td class="ayah-ar">${escapeHtml(startBeginning)}</td><td class="ayah-ar">${escapeHtml(endBeginning)}</td></tr>`;
    }).join('');
    return `
      <h2>${dateLabel}</h2>
      <table class="clusters-table">
        <thead><tr><th>#</th><th>Range (Start–End)</th><th>Surah</th><th>Ayat</th><th>Ayat Mistaken</th><th>Mistakes</th><th>Starting Ayah</th><th>Ending Ayah</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }).join('');
  printHtmlDocument(title, body);
}

// ─── Init ─────────────────────────────────────────────────────────────────────
document.getElementById("version-badge").textContent = "v" + APP_VERSION;
initHizbDetailPage();
</script>
