<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quran Memorization Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f0e8;
      color: #2c2c2c;
      min-height: 100vh;
    }

    header {
      background: #1a3a2a;
      color: #fff;
      padding: 24px 32px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }

    header h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 16px; }

    .stats { display: flex; gap: 32px; align-items: center; flex-wrap: wrap; }

    .stat { display: flex; flex-direction: column; gap: 2px; }

    .stat-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: #9dbfaa; }

    .stat-value { font-size: 1.5rem; font-weight: 700; color: #fff; }

    .stat-pct { font-size: 0.78rem; color: #5cb87a; font-weight: 600; }

    .progress-bar-wrap { flex: 1; min-width: 200px; }

    .progress-bar-bg { background: rgba(255,255,255,0.15); border-radius: 99px; height: 10px; overflow: hidden; }

    .progress-bar-fill {
      background: #5cb87a; height: 100%; border-radius: 99px;
      transition: width 0.3s ease; width: 0%;
    }

    .progress-label { font-size: 0.72rem; color: #9dbfaa; margin-top: 4px; text-align: right; }

    .controls {
      padding: 12px 32px;
      display: flex; gap: 12px; align-items: center;
      background: #eee8d8; border-bottom: 1px solid #d8cdb0; flex-wrap: wrap;
    }

    .controls input[type="text"] {
      padding: 7px 12px; border: 1px solid #c8bda0; border-radius: 6px;
      background: #fff; font-size: 0.875rem; width: 200px; outline: none;
    }

    .controls input[type="text"]:focus { border-color: #3a7a55; }

    button {
      padding: 7px 14px; border: 1px solid #c8bda0; border-radius: 6px;
      background: #fff; font-size: 0.8rem; cursor: pointer; color: #2c2c2c;
      transition: background 0.15s;
    }

    button:hover { background: #f0e8d0; }

    button.primary { background: #1a3a2a; color: #fff; border-color: #1a3a2a; }
    button.primary:hover { background: #2a5a40; }

    /* Juz sections */
    .content { padding: 20px 32px; display: flex; flex-direction: column; gap: 10px; }

    .juz-section { background: #fff; border: 1.5px solid #e0d8c8; border-radius: 10px; overflow: hidden; }

    .juz-header {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; cursor: pointer;
      background: #fff; transition: background 0.15s;
      user-select: none;
    }

    .juz-header:hover { background: #faf6ee; }

    .juz-section.all-memorized .juz-header { background: #eaf5ed; }

    .juz-checkbox {
      width: 18px; height: 18px; accent-color: #3a7a55;
      flex-shrink: 0; cursor: pointer;
    }

    .juz-number {
      background: #1a3a2a; color: #fff;
      font-size: 0.7rem; font-weight: 700;
      padding: 3px 8px; border-radius: 4px;
      flex-shrink: 0; min-width: 52px; text-align: center;
    }

    .juz-section.all-memorized .juz-number { background: #3a8a55; }

    .juz-title { flex: 1; }

    .juz-title-en { font-size: 0.9rem; font-weight: 600; }
    .juz-title-ar { font-size: 0.8rem; color: #6a7a60; direction: rtl; }

    .juz-meta { font-size: 0.72rem; color: #8a7a60; white-space: nowrap; }

    .juz-toggle { font-size: 0.75rem; color: #8a7a60; transition: transform 0.2s; flex-shrink: 0; }
    .juz-section.open .juz-toggle { transform: rotate(180deg); }

    .juz-body {
      display: none;
      padding: 4px 12px 12px;
      border-top: 1px solid #f0e8d8;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 6px;
    }

    .juz-section.open .juz-body { display: grid; }

    /* Surah cards */
    .surah-card {
      background: #faf6ee; border: 1.5px solid #e8e0cc;
      border-radius: 7px; padding: 9px 12px;
      display: flex; align-items: center; gap: 10px;
      cursor: pointer; transition: border-color 0.15s, background 0.15s;
      user-select: none;
    }

    .surah-card:hover { background: #f3ede0; border-color: #bfb090; }

    .surah-card.memorized { background: #eaf5ed; border-color: #5cb87a; }

    .surah-card input[type="checkbox"] {
      width: 16px; height: 16px; accent-color: #3a7a55;
      flex-shrink: 0; cursor: pointer;
    }

    .surah-num { font-size: 0.68rem; color: #8a7a60; width: 20px; text-align: right; flex-shrink: 0; }

    .surah-name { flex: 1; }
    .surah-name-en { font-size: 0.85rem; font-weight: 500; }
    .surah-name-ar { font-size: 0.72rem; color: #6a7a60; direction: rtl; }

    .surah-ayahs { font-size: 0.68rem; color: #8a7a60; white-space: nowrap; flex-shrink: 0; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<header>
  <h1>Quran Memorization Tracker</h1>
  <div class="stats">
    <div class="stat">
      <span class="stat-label">By Surah</span>
      <span class="stat-value" id="stat-surahs">0 / 114</span>
      <span class="stat-pct" id="stat-pct-surahs">0%</span>
    </div>
    <div class="stat">
      <span class="stat-label">By Page</span>
      <span class="stat-value" id="stat-pages">0 / 604</span>
      <span class="stat-pct" id="stat-pct-pages">0%</span>
    </div>
    <div class="stat">
      <span class="stat-label">By Ayah</span>
      <span class="stat-value" id="stat-ayahs">0 / 6,236</span>
      <span class="stat-pct" id="stat-pct-ayahs">0%</span>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <div class="progress-label" id="progress-label">0 of 604 pages</div>
    </div>
  </div>
</header>

<div class="controls">
  <input type="text" id="search" placeholder="Search surah..." />
  <button onclick="selectAll()">Select All</button>
  <button onclick="clearAll()">Clear All</button>
  <button onclick="expandAll()">Expand All</button>
  <button onclick="collapseAll()">Collapse All</button>
  <button class="primary" onclick="saveProgress()">Save</button>
</div>

<div class="content" id="content"></div>

<script>

  [9,"At-Tawba","التوبة",129,10,187,207],[10,"Yunus","يونس",109,11,208,221],
  [11,"Hud","هود",123,11,221,235],[12,"Yusuf","يوسف",111,12,235,248],
  [13,"Ar-Ra'd","الرعد",43,13,249,255],[14,"Ibrahim","إبراهيم",52,13,255,261],
  [15,"Al-Hijr","الحجر",99,14,262,267],[16,"An-Nahl","النحل",128,14,267,281],
  [17,"Al-Isra","الإسراء",111,15,282,293],[18,"Al-Kahf","الكهف",110,15,293,304],
  [19,"Maryam","مريم",98,16,305,312],[20,"Ta-Ha","طه",135,16,312,321],
  [21,"Al-Anbiya","الأنبياء",112,17,322,331],[22,"Al-Hajj","الحج",78,17,332,341],
  [23,"Al-Mu'minun","المؤمنون",118,18,342,349],[24,"An-Nur","النور",64,18,350,359],
  [25,"Al-Furqan","الفرقان",77,18,359,366],[26,"Ash-Shu'ara","الشعراء",227,19,367,376],
  [27,"An-Naml","النمل",93,19,377,385],[28,"Al-Qasas","القصص",88,20,385,396],
  [29,"Al-Ankabut","العنكبوت",69,20,396,404],[30,"Ar-Rum","الروم",60,21,404,410],
  [31,"Luqman","لقمان",34,21,411,414],[32,"As-Sajda","السجدة",30,21,415,417],
  [33,"Al-Ahzab","الأحزاب",73,21,418,427],[34,"Saba","سبأ",54,22,428,434],
  [35,"Fatir","فاطر",45,22,434,440],[36,"Ya-Sin","يس",83,22,440,445],
  [37,"As-Saffat","الصافات",182,23,446,452],[38,"Sad","ص",88,23,453,458],
  [39,"Az-Zumar","الزمر",75,23,458,467],[40,"Ghafir","غافر",85,24,467,476],
  [41,"Fussilat","فصلت",54,24,477,482],[42,"Ash-Shura","الشورى",53,25,483,489],
  [43,"Az-Zukhruf","الزخرف",89,25,489,495],[44,"Ad-Dukhan","الدخان",59,25,496,498],
  [45,"Al-Jathiya","الجاثية",37,25,499,502],[46,"Al-Ahqaf","الأحقاف",35,26,502,506],
  [47,"Muhammad","محمد",38,26,507,510],[48,"Al-Fath","الفتح",29,26,511,515],
  [49,"Al-Hujurat","الحجرات",18,26,515,517],[50,"Qaf","ق",45,26,518,520],
  [51,"Adh-Dhariyat","الذاريات",60,26,520,523],[52,"At-Tur","الطور",49,27,523,525],
  [53,"An-Najm","النجم",62,27,526,528],[54,"Al-Qamar","القمر",55,27,528,531],
  [55,"Ar-Rahman","الرحمن",78,27,531,534],[56,"Al-Waqi'a","الواقعة",96,27,534,537],
  [57,"Al-Hadid","الحديد",29,27,537,541],[58,"Al-Mujadila","المجادلة",22,28,542,545],
  [59,"Al-Hashr","الحشر",24,28,545,548],[60,"Al-Mumtahina","الممتحنة",13,28,549,551],
  [61,"As-Saf","الصف",14,28,551,552],[62,"Al-Jumu'a","الجمعة",11,28,553,554],
  [63,"Al-Munafiqun","المنافقون",11,28,554,555],[64,"At-Taghabun","التغابن",18,28,556,557],
  [65,"At-Talaq","الطلاق",12,28,558,559],[66,"At-Tahrim","التحريم",12,28,560,561],
  [67,"Al-Mulk","الملك",30,29,562,564],[68,"Al-Qalam","القلم",52,29,564,566],
  [69,"Al-Haqqah","الحاقة",52,29,566,568],[70,"Al-Ma'arij","المعارج",44,29,568,570],
  [71,"Nuh","نوح",28,29,570,571],[72,"Al-Jinn","الجن",28,29,572,573],
  [73,"Al-Muzzammil","المزمل",20,29,574,575],[74,"Al-Muddaththir","المدثر",56,29,575,577],
  [75,"Al-Qiyama","القيامة",40,29,577,578],[76,"Al-Insan","الإنسان",31,29,578,580],
  [77,"Al-Mursalat","المرسلات",50,29,580,581],[78,"An-Naba","النبأ",40,30,582,583],
  [79,"An-Nazi'at","النازعات",46,30,583,584],[80,"Abasa","عبس",42,30,585,585],
  [81,"At-Takwir","التكوير",29,30,586,586],[82,"Al-Infitar","الانفطار",19,30,587,587],
  [83,"Al-Mutaffifin","المطففين",36,30,587,589],[84,"Al-Inshiqaq","الانشقاق",25,30,589,589],
  [85,"Al-Buruj","البروج",22,30,590,590],[86,"At-Tariq","الطارق",17,30,591,591],
  [87,"Al-A'la","الأعلى",19,30,591,592],[88,"Al-Ghashiya","الغاشية",26,30,592,592],
  [89,"Al-Fajr","الفجر",30,30,593,594],[90,"Al-Balad","البلد",20,30,594,594],
  [91,"Ash-Shams","الشمس",15,30,595,595],[92,"Al-Layl","الليل",21,30,595,596],
  [93,"Ad-Duha","الضحى",11,30,596,596],[94,"Ash-Sharh","الشرح",8,30,596,596],
  [95,"At-Tin","التين",8,30,597,597],[96,"Al-Alaq","العلق",19,30,597,597],
  [97,"Al-Qadr","القدر",5,30,598,598],[98,"Al-Bayyina","البينة",8,30,598,599],
  [99,"Az-Zalzala","الزلزلة",8,30,599,599],[100,"Al-Adiyat","العاديات",11,30,599,600],
  [101,"Al-Qari'a","القارعة",11,30,600,600],[102,"At-Takathur","التكاثر",8,30,600,600],
  [103,"Al-Asr","العصر",3,30,601,601],[104,"Al-Humaza","الهمزة",9,30,601,601],
  [105,"Al-Fil","الفيل",5,30,601,601],[106,"Quraysh","قريش",4,30,602,602],
  [107,"Al-Ma'un","الماعون",7,30,602,602],[108,"Al-Kawthar","الكوثر",3,30,602,602],
  [109,"Al-Kafirun","الكافرون",6,30,603,603],[110,"An-Nasr","النصر",3,30,603,603],
  [111,"Al-Masad","المسد",5,30,603,603],[112,"Al-Ikhlas","الإخلاص",4,30,604,604],
  [113,"Al-Falaq","الفلق",5,30,604,604],[114,"An-Nas","الناس",6,30,604,604],
];

// Juz names (opening words)
const JUZ_NAMES = [
  "","الم","سَيَقُولُ","تِلْكَ الرُّسُلُ","لَنْ تَنَالُوا","وَالْمُحْصَنَاتُ",
  "لَا يُحِبُّ اللَّهُ","وَإِذَا سَمِعُوا","وَلَوْ أَنَّنَا","قَالَ الْمَلَأُ","وَاعْلَمُوا",
  "يَعْتَذِرُونَ","وَمَا مِنْ دَابَّةٍ","وَمَا أُبَرِّئُ","رُبَمَا","سُبْحَانَ",
  "قَالَ أَلَمْ","اقْتَرَبَ","قَدْ أَفْلَحَ","وَقَالَ الَّذِينَ","أَمَّنْ خَلَقَ",
  "اتْلُ مَا أُوحِيَ","وَمَنْ يَقْنُتْ","وَمَا لِيَ","فَمَنْ أَظْلَمُ","إِلَيْهِ يُرَدُّ",
  "حم","قَالَ فَمَا خَطْبُكُمْ","قَدْ سَمِعَ","تَبَارَكَ","عَمَّ",
];

const TOTAL_AYAHS = 6236;
const TOTAL_PAGES = 604;
const checked = new Set();

// Group surahs by juz
const byJuz = {};
for (let j = 1; j <= 30; j++) byJuz[j] = [];
SURAHS.forEach(s => byJuz[s[4]].push(s));

function render(filter = "") {
  const content = document.getElementById("content");
  const q = filter.toLowerCase();
  content.innerHTML = "";

  for (let juz = 1; juz <= 30; juz++) {
    const surahs = byJuz[juz];
    const filtered = q
      ? surahs.filter(([num, en, ar]) =>
          en.toLowerCase().includes(q) || ar.includes(q) || String(num).includes(q))
      : surahs;

    if (q && filtered.length === 0) continue;

    const juzAyahs = surahs.reduce((s, x) => s + x[3], 0);
    const juzPages = Math.max(...surahs.map(x => x[6])) - Math.min(...surahs.map(x => x[5])) + 1;
    const memorizedCount = surahs.filter(([num]) => checked.has(num)).length;
    const allMemorized = memorizedCount === surahs.length;
    const someMemorized = memorizedCount > 0 && !allMemorized;

    const section = document.createElement("div");
    section.className = "juz-section" + (allMemorized ? " all-memorized" : "") + (q ? " open" : "");
    section.dataset.juz = juz;

    // Header
    const header = document.createElement("div");
    header.className = "juz-header";
    header.innerHTML = `
      <input type="checkbox" class="juz-checkbox" ${allMemorized ? "checked" : ""} />
      <span class="juz-number">Juz ${juz}</span>
      <span class="juz-title">
        <div class="juz-title-en">Juz ${juz}</div>
        <div class="juz-title-ar">${JUZ_NAMES[juz]}</div>
      </span>
      <span class="juz-meta">${surahs.length} surahs · ${juzPages}p · ${juzAyahs.toLocaleString()}v${memorizedCount > 0 ? ` · ${memorizedCount}/${surahs.length} memorized` : ""}</span>
      <span class="juz-toggle">▼</span>
    `;

    const cb = header.querySelector(".juz-checkbox");
    cb.indeterminate = someMemorized;

    cb.addEventListener("change", e => {
      e.stopPropagation();
      surahs.forEach(([num]) => e.target.checked ? checked.add(num) : checked.delete(num));
      render(document.getElementById("search").value);
      updateStats();
    });

    header.addEventListener("click", e => {
      if (e.target.classList.contains("juz-checkbox")) return;
      section.classList.toggle("open");
    });

    // Body
    const body = document.createElement("div");
    body.className = "juz-body";

    filtered.forEach(([num, en, ar, ayahs, , startPage, endPage]) => {
      const pages = endPage - startPage + 1;
      const card = document.createElement("label");
      card.className = "surah-card" + (checked.has(num) ? " memorized" : "");
      card.innerHTML = `
        <input type="checkbox" ${checked.has(num) ? "checked" : ""} />
        <span class="surah-num">${num}</span>
        <span class="surah-name">
          <div class="surah-name-en">${en}</div>
          <div class="surah-name-ar">${ar}</div>
        </span>
        <span class="surah-ayahs">${pages}p · ${ayahs}v</span>
      `;
      card.querySelector("input").addEventListener("change", e => {
        e.target.checked ? checked.add(num) : checked.delete(num);
        card.classList.toggle("memorized", e.target.checked);
        // Update juz header state
        const sec = document.querySelector(`.juz-section[data-juz="${num > 0 ? surahs[0][4] : 1}"]`);
        refreshJuzHeader(juz);
        updateStats();
      });
      body.appendChild(card);
    });

    section.appendChild(header);
    section.appendChild(body);
    content.appendChild(section);
  }
}

function refreshJuzHeader(juz) {
  const section = document.querySelector(`.juz-section[data-juz="${juz}"]`);
  if (!section) return;
  const surahs = byJuz[juz];
  const memorizedCount = surahs.filter(([num]) => checked.has(num)).length;
  const allMemorized = memorizedCount === surahs.length;
  const someMemorized = memorizedCount > 0 && !allMemorized;
  const juzAyahs = surahs.reduce((s, x) => s + x[3], 0);
  const juzPages = Math.max(...surahs.map(x => x[6])) - Math.min(...surahs.map(x => x[5])) + 1;

  section.classList.toggle("all-memorized", allMemorized);
  const cb = section.querySelector(".juz-checkbox");
  cb.checked = allMemorized;
  cb.indeterminate = someMemorized;
  section.querySelector(".juz-meta").textContent =
    `${surahs.length} surahs · ${juzPages}p · ${juzAyahs.toLocaleString()}v${memorizedCount > 0 ? ` · ${memorizedCount}/${surahs.length} memorized` : ""}`;
}

function updateStats() {
  let totalAyahs = 0, totalSurahs = 0;
  const pageSet = new Set();
  SURAHS.forEach(([num, , , ayahs, , startPage, endPage]) => {
    if (checked.has(num)) {
      totalAyahs += ayahs;
      totalSurahs++;
      for (let p = startPage; p <= endPage; p++) pageSet.add(p);
    }
  });
  const totalPages = pageSet.size;
  const pctSurahs = (totalSurahs / 114 * 100).toFixed(1);
  const pctPages  = Math.min(totalPages / TOTAL_PAGES * 100, 100).toFixed(1);
  const pctAyahs  = (totalAyahs / TOTAL_AYAHS * 100).toFixed(1);

  document.getElementById("stat-surahs").textContent    = `${totalSurahs} / 114`;
  document.getElementById("stat-pct-surahs").textContent = `${pctSurahs}%`;
  document.getElementById("stat-pages").textContent     = `${totalPages} / 604`;
  document.getElementById("stat-pct-pages").textContent  = `${pctPages}%`;
  document.getElementById("stat-ayahs").textContent     = `${totalAyahs.toLocaleString()} / 6,236`;
  document.getElementById("stat-pct-ayahs").textContent  = `${pctAyahs}%`;
  document.getElementById("progress-fill").style.width  = `${pctPages}%`;
  document.getElementById("progress-label").textContent = `${totalPages} of 604 pages (${pctPages}%)`;
}

function selectAll() {
  SURAHS.forEach(([num]) => checked.add(num));
  render(document.getElementById("search").value);
  updateStats();
}

function clearAll() {
  checked.clear();
  render(document.getElementById("search").value);
  updateStats();
}

function expandAll() {
  document.querySelectorAll(".juz-section").forEach(s => s.classList.add("open"));
}

function collapseAll() {
  document.querySelectorAll(".juz-section").forEach(s => s.classList.remove("open"));
}

function saveProgress() {
  localStorage.setItem("quran_memorized", JSON.stringify([...checked]));
  const btn = document.querySelector("button.primary");
  btn.textContent = "Saved!";
  setTimeout(() => btn.textContent = "Save", 1500);
}

document.getElementById("search").addEventListener("input", e => render(e.target.value));

// Load saved progress
const saved = localStorage.getItem("quran_memorized");
if (saved) JSON.parse(saved).forEach(n => checked.add(n));
render();
updateStats();
</script>
</body>
</html>
