<title>Revise</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Revise" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="manifest" href="manifest.json" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;700&display=swap" />
<script src="version.js"></script>
<script src="quran-data.js"></script>
<script src="quran-cache.js"></script>

<style>
/* ── Palette ─────────────────────────────────────────────────────────── */
:root {
  --bg:           #eef4ee;
  --surface:      #ffffff;
  --surface-2:    #f4f8f4;
  --border:       #cfe0cf;
  --text:         #182818;
  --muted:        #527856;
  --accent:       #2b6e44;
  --accent-dim:   #3d8a5a;
  --accent-text:  #ffffff;
  --ar-bg:        #f2f8f2;
  --ar-border:    #c6dbc6;
  --import-bg:    #f7faf7;
  --import-bdr:   #d8e8d8;
  --err:          #c0392b;
  --err-bg:       #fdf0ee;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:           #0d1f1a;
    --surface:      #142a20;
    --surface-2:    #1c3628;
    --border:       #2a4838;
    --text:         #d8eed8;
    --muted:        #7aaa80;
    --accent:       #5dbb8a;
    --accent-dim:   #4da87a;
    --accent-text:  #0d1f1a;
    --ar-bg:        #1a3828;
    --ar-border:    #2e5040;
    --import-bg:    #111e18;
    --import-bdr:   #223a2c;
    --err:          #e08080;
    --err-bg:       #2a1010;
  }
}
:root[data-theme="dark"] {
  --bg:           #0d1f1a;
  --surface:      #142a20;
  --surface-2:    #1c3628;
  --border:       #2a4838;
  --text:         #d8eed8;
  --muted:        #7aaa80;
  --accent:       #5dbb8a;
  --accent-dim:   #4da87a;
  --accent-text:  #0d1f1a;
  --ar-bg:        #1a3828;
  --ar-border:    #2e5040;
  --import-bg:    #111e18;
  --import-bdr:   #223a2c;
  --err:          #e08080;
  --err-bg:       #2a1010;
}

/* ── Reset ───────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  padding-top:    env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  padding-left:   env(safe-area-inset-left);
  padding-right:  env(safe-area-inset-right);
  display: flex;
  flex-direction: column;
  -webkit-text-size-adjust: 100%;
}

/* ── Header ──────────────────────────────────────────────────────────── */
header {
  padding: 14px 22px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.app-title {
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.13em;
  color: var(--muted);
}
.ver {
  font-size: 0.7rem;
  color: var(--muted);
  opacity: 0.55;
  font-variant-numeric: tabular-nums;
}

/* ── Main layout ─────────────────────────────────────────────────────── */
main {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 4px 18px 22px;
  max-width: 520px;
  width: 100%;
  margin: 0 auto;
}

/* ── Revise card ─────────────────────────────────────────────────────── */
.revise-card {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 22px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.revise-btn {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 22px;
  background: none;
  border: none;
  cursor: pointer;
  width: 100%;
  text-align: left;
  color: var(--text);
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.12s;
}
.revise-btn:active { background: var(--surface-2); }

.btn-icon {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  background: var(--accent);
  color: var(--accent-text);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  flex-shrink: 0;
  transition: transform 0.12s;
}
.revise-btn:active .btn-icon { transform: scale(0.93); }

.btn-text h2 {
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: -0.01em;
  margin-bottom: 3px;
}
.btn-text p {
  font-size: 0.8rem;
  color: var(--muted);
  line-height: 1.4;
}

/* ── States inside the revise card ──────────────────────────────────── */
.card-inner {
  border-top: 1px solid var(--border);
  padding: 20px 22px 24px;
  flex: 1;
  display: none;
  flex-direction: column;
}
.card-inner.visible { display: flex; }

/* Loading */
.loading-dots { display: flex; gap: 8px; align-items: center; padding: 8px 0; }
.dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  background: var(--accent);
  animation: blink 1.1s ease-in-out infinite;
}
.dot:nth-child(2) { animation-delay: 0.18s; }
.dot:nth-child(3) { animation-delay: 0.36s; }
@keyframes blink {
  0%, 100% { opacity: 0.25; transform: scale(0.8); }
  50%       { opacity: 1;    transform: scale(1.1); }
}

/* Error */
.err-msg { font-size: 0.84rem; color: var(--err); line-height: 1.5; }

/* Result */
.arabic-block {
  background: var(--ar-bg);
  border: 1px solid var(--ar-border);
  border-radius: 14px;
  padding: 18px 16px;
  margin-bottom: 18px;
  direction: rtl;
  text-align: right;
  font-family: "Scheherazade New", "Traditional Arabic", "Arabic Typesetting", "Noto Naskh Arabic", serif;
  font-size: 1.55rem;
  line-height: 2;
  color: var(--text);
  flex-shrink: 0;
}

.result-meta {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 10px;
  flex-shrink: 0;
}
.result-ref {
  font-size: 1.05rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}
.result-surah {
  font-size: 0.83rem;
  color: var(--muted);
}

.result-trans {
  font-size: 0.84rem;
  color: var(--muted);
  line-height: 1.6;
  font-style: italic;
  flex: 1;
  overflow-y: auto;
  margin-bottom: 20px;
}

.pick-again {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 14px;
  background: var(--accent);
  color: var(--accent-text);
  border: none;
  border-radius: 13px;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  flex-shrink: 0;
  transition: background 0.12s, transform 0.1s;
  -webkit-tap-highlight-color: transparent;
  width: 100%;
}
.pick-again:active { transform: scale(0.97); background: var(--accent-dim); }

/* ── Import card ─────────────────────────────────────────────────────── */
.import-card {
  background: var(--import-bg);
  border: 1px solid var(--import-bdr);
  border-radius: 22px;
  padding: 20px 22px;
  display: flex;
  align-items: center;
  gap: 16px;
  text-decoration: none;
  color: var(--text);
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.12s;
}
.import-card:active { background: var(--surface-2); }

.import-icon {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  background: var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  flex-shrink: 0;
  transition: transform 0.12s;
}
.import-card:active .import-icon { transform: scale(0.93); }

.import-text h2 {
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: -0.01em;
  margin-bottom: 3px;
}
.import-text p {
  font-size: 0.8rem;
  color: var(--muted);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* Focus ring for accessibility */
button:focus-visible, a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
</style>

<header>
  <span class="app-title">Quran</span>
  <span class="ver" id="ver"></span>
</header>

<main>

  <!-- ── Revise card ── -->
  <div class="revise-card">
    <button class="revise-btn" onclick="doRevise()" aria-label="Pick a page to revise">
      <div class="btn-icon">📖</div>
      <div class="btn-text">
        <h2>Revise</h2>
        <p id="btn-sub">Loading…</p>
      </div>
    </button>

    <!-- Loading -->
    <div class="card-inner" id="state-loading">
      <div class="loading-dots">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
    </div>

    <!-- Error -->
    <div class="card-inner" id="state-error">
      <p class="err-msg" id="err-msg"></p>
    </div>

    <!-- Result -->
    <div class="card-inner" id="state-result">
      <div class="arabic-block" id="ar-text" dir="rtl" lang="ar"></div>
      <div class="result-meta">
        <span class="result-ref" id="r-ref"></span>
        <span class="result-surah" id="r-surah"></span>
      </div>
      <p class="result-trans" id="r-trans"></p>
      <button class="pick-again" onclick="doRevise()">Pick Another &nbsp;↺</button>
    </div>
  </div>

  <!-- ── Import card ── -->
  <a class="import-card" href="review.html?action=telegram-import">
    <div class="import-icon">📥</div>
    <div class="import-text">
      <h2>Import</h2>
      <p>Sync mistakes from Telegram</p>
    </div>
  </a>

</main>

<script>
// ── Init ──────────────────────────────────────────────────────────────
document.getElementById('ver').textContent = 'v' + APP_VERSION;
document.getElementById('btn-sub').textContent = hizbDesc();

let lastGlobal = null;

function readLocal(key) {
  try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch { return []; }
}

function hizbDesc() {
  const hs = readLocal('quranReviewMemorizedHizbs').map(Number).filter(h => h >= 1 && h <= 60);
  if (!hs.length) return 'No hizbs configured — open the full app';
  if (hs.length <= 5) return 'Hizb ' + hs.join(', ');
  return hs.length + ' memorized hizbs';
}

// ── State management ──────────────────────────────────────────────────
function showState(id) {
  ['state-loading', 'state-error', 'state-result'].forEach(s => {
    document.getElementById(s).classList.toggle('visible', s === id);
  });
}

function showError(msg) {
  document.getElementById('err-msg').textContent = msg;
  showState('state-error');
  document.getElementById('btn-sub').textContent = hizbDesc();
}

function showResult({ ref, surahName, arabic, translation }) {
  document.getElementById('r-ref').textContent = ref;
  document.getElementById('r-surah').textContent = '— ' + surahName;
  document.getElementById('ar-text').textContent = arabic;
  const t = translation.length > 240 ? translation.slice(0, 240) + '…' : translation;
  document.getElementById('r-trans').textContent = t;
  showState('state-result');
  document.getElementById('btn-sub').textContent = hizbDesc();
}

// ── Pick logic ────────────────────────────────────────────────────────
async function doRevise() {
  const hizbs = readLocal('quranReviewMemorizedHizbs').map(Number).filter(h => h >= 1 && h <= 60);
  if (!hizbs.length) {
    showError('No memorized hizbs found. Open the full app to mark your hizbs first.');
    return;
  }

  // Build pool of global ayah indices
  const pool = [];
  for (const h of hizbs) {
    const r = hizbRange(h);
    if (r) for (let g = r[0]; g <= r[1]; g++) pool.push(g);
  }

  // Build mistake weights: globalAyah → count
  const weights = new Map();
  for (const m of readLocal('quranReviewAyahMistakes')) {
    if (m.type && m.type.includes('A')) continue;
    if (!SURAH_OFFSETS[m.surah]) continue;
    const g = SURAH_OFFSETS[m.surah] + m.ayah - 1;
    weights.set(g, (weights.get(g) || 0) + 1);
  }

  // 60% from mistake bucket; retry up to 4× to avoid same ayah back-to-back
  let g;
  for (let attempt = 0; attempt < 5; attempt++) {
    const mPool = pool.filter(x => weights.has(x));
    if (mPool.length && Math.random() < 0.6) {
      const total = mPool.reduce((s, x) => s + weights.get(x), 0);
      let rand = Math.random() * total;
      for (const x of mPool) { const w = weights.get(x); if (rand < w) { g = x; break; } rand -= w; }
      if (g === undefined) g = mPool[mPool.length - 1];
    } else {
      g = pool[Math.floor(Math.random() * pool.length)];
    }
    if (g !== lastGlobal || pool.length === 1) break;
    g = undefined;
  }
  if (g === undefined) g = pool[Math.floor(Math.random() * pool.length)];

  lastGlobal = g;
  const { surah, ayah } = globalToSurahAyah(g);

  showState('state-loading');
  document.getElementById('btn-sub').textContent = 'Loading…';

  try {
    const data = await fetchSurahData(surah);
    const ar = data.arabicAyahs[ayah - 1];
    const en = data.transAyahs[ayah - 1];
    if (!ar) throw new Error('Ayah not found in API response');
    showResult({
      ref: surah + ':' + ayah,
      surahName: data.surahInfo.englishName,
      arabic: ar.text,
      translation: en ? en.text : '',
    });
  } catch (e) {
    showError('Could not load ayah text. Check your connection and try again.');
  }
}
</script>
